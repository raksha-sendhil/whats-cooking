[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "whats-cooking"
version = "0.1.0"
description = "Personal tech-trend feed that turns forums, repos and papers into insights"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "feedparser>=6.0",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "fastembed>=0.4",
    "selectolax>=0.3.21",
    "tzdata>=2024.1",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
whats-cooking = "whats_cooking.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
